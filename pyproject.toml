[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-anomaly"
version = "0.1.0"
description = "FLASH: a generate-once, synthesise-many framework for reference-free synthetic anomaly generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Abhay Kumar Das" }]
keywords = ["anomaly-detection", "synthetic-data", "industrial-inspection", "mvtec-ad-2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Runtime dependencies of src/flash only. torchvision is deliberately absent: the package uses
# torch for the FFT in mrsp.py and needs nothing else from that stack, and requiring it would
# break installs on environments that have torch but not torchvision.
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
    "torch>=2.0",
    "pillow>=10.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Modules 1 and 2 only. Module 3 loads no model.
vlm = ["transformers>=4.49", "accelerate>=0.30"]
# The evaluation notebooks. A full detector stack, not needed to generate data.
eval = ["anomalib>=1.0", "timm>=1.0", "scikit-learn>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.7", "nbstripout>=0.7"]

[project.urls]
Homepage = "https://github.com/AbhayKumarDas/flash"
Repository = "https://github.com/AbhayKumarDas/flash"
Issues = "https://github.com/AbhayKumarDas/flash/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# 110, not the usual 88/100: the operators in src/flash are a verbatim copy of the reference
# implementation the published results were produced with, and its longest lines reach 105.
# Reflowing verified numerical code to satisfy a style rule is the wrong trade -- the config
# describes the code, not the other way round.
line-length = 110
target-version = "py310"
# Notebooks and their source fragments are excluded. A notebook cell is not a module: an import
# in one cell is used by a later cell, so F401, F811 and E402 report things that are not errors.
# The notebooks are checked by tools/build_notebooks.py --check instead, and the library code
# they import lives in src/flash, which IS linted.
exclude = ["tools/notebook_src", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # `a = 1; b = 2` on one line. Used deliberately throughout the reference implementation to
    # keep tightly-coupled pairs (h, w / y0, x0 / mean, std) visually adjacent. Splitting them
    # would edit verbatim code and, in this style, read worse.
    "E702",
]

[tool.ruff.lint.per-file-ignores]
# Verbatim reference code. New code in this package should not need these.
"src/flash/diffmask.py" = ["E741"]   # `l` as a loop variable in the original

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need the datasets skip themselves when the data is absent, so a plain `pytest` on a
# fresh clone reports skips rather than failures.
addopts = "-ra"
